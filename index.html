<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물 붓기</title>
<style>
:root{--bg:#eef3f6;--ink:#17323d;--mute:#5d7580;--card:#fff;--line:#cfdce3;--accent:#0f7c8f;--glass:#f8fcfd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--ink:#e6f1f4;--mute:#8fa8b2;--card:#182830;--line:#2a3f49;--accent:#3cc0d6;--glass:#1c313a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:-.02em}
p.sub{margin:0 0 20px;color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.stage:focus-visible,.tube:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.stage b{display:block;font-size:20px}
.stage small{color:var(--mute)}
.stage.done{border-color:var(--accent)}
.stage:disabled{opacity:.4;cursor:default}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar span{color:var(--mute)}
.tubes{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 14px;padding:36px 0 16px}
.tube{width:46px;height:168px;border:3px solid var(--line);border-top-color:transparent;border-radius:6px 6px 24px 24px;background:var(--glass);display:flex;flex-direction:column-reverse;padding:2px;gap:2px;transition:transform .15s;cursor:pointer}
.tube.sel{transform:translateY(-22px);border-color:var(--accent);border-top-color:transparent}
.seg{flex:1;border-radius:4px 4px 18px 18px}
.seg:not(:first-child){border-radius:4px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:12px}
.overlay{position:fixed;inset:0;background:rgba(10,25,32,.55);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:18px;padding:24px;max-width:320px;width:100%;text-align:center}
.modal h2{margin:0 0 6px}
.modal p{color:var(--mute);margin:0 0 18px}
.modal .btn{margin:4px}
.modebtn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:10px 0}
.modebtn b{display:block;font-size:20px;margin-bottom:4px}
.modebtn small{color:var(--mute)}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px}
.lang button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px}
.lang button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.modebtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kid .tubes{gap:30px 18px}
.kid .tube{width:62px;height:208px;border-radius:8px 8px 30px 30px}
.kid .seg{border-radius:6px 6px 26px 26px}
.kid .seg:not(:first-child){border-radius:6px}
.kid #moves{display:none}
.kid .modal h2{font-size:28px}
@keyframes fill{from{transform:translateY(-70px);opacity:.1}to{transform:none;opacity:1}}
@keyframes tip{0%{transform:rotate(0)}40%{transform:rotate(-16deg) translateY(-10px)}100%{transform:rotate(0)}}
.seg.new{animation:fill .35s ease-out}
.tube.from{animation:tip .4s ease-in-out}
@media (prefers-reduced-motion:reduce){.seg.new,.tube.from{animation:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.kid .overlay.on .modal{animation:pop .4s}
@media (prefers-reduced-motion:reduce){.kid .overlay.on .modal{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="lang" id="lang"></div>
<section id="mode" hidden>
  <h1>누가 하나요?</h1>
  <p class="sub">고른 모드에 맞춰 난이도와 화면이 바뀌어요. 나중에 언제든 바꿀 수 있어요.</p>
  <button class="modebtn" id="m-kid"><b>🧒 아이</b><small>색이 적고 병이 커서 쉬워요</small></button>
  <button class="modebtn" id="m-adult"><b>🧑 어른</b><small>색이 많아 생각할 거리가 있어요</small></button>
</section>
<section id="home" hidden>
  <h1>물 붓기</h1>
  <p class="sub">병을 눌러 물을 옮겨서, 한 병에 한 가지 색만 남겨 보세요.</p>
  <button class="btn" id="resume" hidden>이어하기</button>
  <button class="btn ghost" id="swmode"></button>
  <div class="grid" id="grid"></div>
</section>
<section id="game" hidden>
  <div class="bar"><button class="btn ghost" id="back">목록</button><strong id="title"></strong><span id="moves"></span></div>
  <div class="tubes" id="tubes"></div>
  <div class="actions"><button class="btn ghost" id="undo">되돌리기</button><button class="btn ghost" id="mute"></button><button class="btn ghost" id="restart">다시 시작</button></div>
</section>
</main>
<div class="overlay" id="win"><div class="modal"><h2 id="wintitle">클리어!</h2><p id="winmsg"></p><button class="btn" id="next">다음 단계</button><button class="btn ghost" id="tolist">목록</button></div></div>
<script>
const COLORS=["#e5484d","#f5a524","#f2d94e","#46a758","#12a594","#3e63dd","#8e4ec6","#e93d82","#8b8d98","#7dd3fc","#8a5a33"];
const TOTAL=30, CAP=4, KEY="waterSort.v1";
let S={mode:null,data:{},cleared:{},cur:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
if(!S.mode&&(Object.keys(S.cleared).length||S.cur))S.mode="adult";
function save(){try{if(S.mode)S.data[S.mode]={cleared:S.cleared,cur:S.cur};localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function setMode(m){
  if(S.mode)S.data[S.mode]={cleared:S.cleared,cur:S.cur};
  S.mode=m;const d=S.data[m]||{cleared:{},cur:null};S.cleared=d.cleared;S.cur=d.cur;
  document.body.classList.toggle("kid",m==="kid");save();
}
const $=id=>document.getElementById(id);
const L={
ko:{title:"물 붓기",who:"누가 하나요?",whoSub:"고른 모드에 맞춰 난이도와 화면이 바뀌어요. 나중에 언제든 바꿀 수 있어요.",kid:"🧒 아이",kidSub:"색이 적고 병이 커서 쉬워요",adult:"🧑 어른",adultSub:"색이 많아 생각할 거리가 있어요",sub:"병을 눌러 물을 옮겨서, 한 병에 한 가지 색만 남겨 보세요.",resume:"이어하기",resumeN:"이어하기 · {n}단계",toKid:"아이 모드로 바꾸기",toAdult:"어른 모드로 바꾸기",best:"최고 {n}회",todo:"미클리어",stage:"{n}단계",moves:"이동 {n}회",back:"목록",undo:"되돌리기",restart:"다시 시작",soundOn:"소리 켜기",soundOff:"소리 끄기",clear:"클리어!",kidClear:"와, 해냈어요!",kidMsg:"참 잘했어요! ⭐⭐⭐",solved:"{n}회 만에 풀었어요.",keep:" 최고 기록은 {p}회예요.",newBest:" 새 최고 기록이에요!",next:"다음 단계",tube:"{n}번 병"},
ja:{title:"水そそぎ",who:"だれが遊びますか?",whoSub:"選んだモードに合わせて難しさと画面が変わります。あとからいつでも変えられます。",kid:"🧒 こども",kidSub:"色が少なくて、びんが大きいのでやさしいです",adult:"🧑 おとな",adultSub:"色が多くて、考えごたえがあります",sub:"びんをタップして水を移し、１本のびんに１色だけが残るようにしましょう。",resume:"つづきから",resumeN:"つづきから · ステージ{n}",toKid:"こどもモードに切り替え",toAdult:"おとなモードに切り替え",best:"ベスト {n}回",todo:"未クリア",stage:"ステージ {n}",moves:"移動 {n}回",back:"一覧",undo:"１つ戻す",restart:"やり直す",soundOn:"音をオン",soundOff:"音をオフ",clear:"クリア!",kidClear:"やったね!",kidMsg:"よくできました! ⭐⭐⭐",solved:"{n}回で解けました。",keep:" ベストは{p}回です。",newBest:" ベスト記録を更新しました!",next:"次のステージ",tube:"{n}番のびん"},
en:{title:"Water Sort",who:"Who’s playing?",whoSub:"Difficulty and visuals change with the mode you pick. You can switch anytime.",kid:"🧒 Kid",kidSub:"Fewer colors and bigger bottles, so it’s easier",adult:"🧑 Adult",adultSub:"More colors, more to think about",sub:"Tap bottles to pour, until each bottle holds just one color.",resume:"Continue",resumeN:"Continue · Stage {n}",toKid:"Switch to Kid mode",toAdult:"Switch to Adult mode",best:"Best {n}",todo:"Not cleared",stage:"Stage {n}",moves:"Moves {n}",back:"Stages",undo:"Undo",restart:"Restart",soundOn:"Sound on",soundOff:"Sound off",clear:"Cleared!",kidClear:"You did it!",kidMsg:"Great job! ⭐⭐⭐",solved:"Solved in {n} moves.",keep:" Your best is {p}.",newBest:" New best!",next:"Next stage",tube:"Bottle {n}"}
};
function detect(){const l=(navigator.language||"en").slice(0,2);return L[l]?l:"en";}
if(!S.lang)S.lang=detect();
function t(k,v){let s=(L[S.lang]||L.en)[k];if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s;}
function refresh(){if(!$("game").hidden&&S.cur)render();else if(!$("home").hidden)showHome();}
function applyLang(){
  document.documentElement.lang=S.lang;document.title=t("title");
  $("mode").querySelector("h1").textContent=t("who");
  $("mode").querySelector(".sub").textContent=t("whoSub");
  $("m-kid").innerHTML="<b>"+t("kid")+"</b><small>"+t("kidSub")+"</small>";
  $("m-adult").innerHTML="<b>"+t("adult")+"</b><small>"+t("adultSub")+"</small>";
  $("home").querySelector("h1").textContent=t("title");
  $("home").querySelector(".sub").textContent=t("sub");
  $("back").textContent=t("back");$("undo").textContent=t("undo");$("restart").textContent=t("restart");
  $("next").textContent=t("next");$("tolist").textContent=t("back");
  setMute();
  const lg=$("lang");lg.innerHTML="";
  [["ko","한국어"],["ja","日本語"],["en","English"]].forEach(([c,n])=>{const b=document.createElement("button");b.textContent=n;b.className=c===S.lang?"on":"";b.onclick=()=>{S.lang=c;save();applyLang();refresh();};lg.appendChild(b);});
}
let sel=null,lastMove=null,AC=null;
function snd(type){
  if(S.mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime;
    const tone=(f,d,at,ty,g)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t0+at);v.gain.setValueAtTime(0.0001,t0+at);v.gain.exponentialRampToValueAtTime(g||0.15,t0+at+0.01);v.gain.exponentialRampToValueAtTime(0.0001,t0+at+d);o.connect(v);v.connect(AC.destination);o.start(t0+at);o.stop(t0+at+d+0.02);};
    if(type==="sel")tone(660,0.08,0);
    else if(type==="undo")tone(400,0.1,0);
    else if(type==="pour"){for(let i=0;i<5;i++)tone(420+i*70+Math.random()*30,0.09,i*0.06,"sine",0.12);}
    else if(type==="win"){[523,659,784,1047].forEach((f,i)=>tone(f,0.25,i*0.12,"triangle",0.18));}
  }catch(e){}
}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function solvable(T){
  const seen=new Set();let nodes=0;
  const key=s=>s.map(x=>x.join(",")).sort().join("|");
  function dfs(s){
    if(s.every(x=>x.length===0||(x.length===CAP&&x.every(v=>v===x[0]))))return true;
    const k=key(s);if(seen.has(k))return false;seen.add(k);
    if(++nodes>8000)return false;
    for(let a=0;a<s.length;a++){
      const A=s[a];if(!A.length)continue;
      const col=A[A.length-1],pure=A.every(v=>v===col);
      if(pure&&A.length===CAP)continue;
      for(let b=0;b<s.length;b++){
        const B=s[b];if(a===b||B.length>=CAP)continue;
        if(B.length?B[B.length-1]!==col:pure)continue;
        const ns=s.map(x=>x.slice());
        while(ns[a].length&&ns[a][ns[a].length-1]===col&&ns[b].length<CAP)ns[b].push(ns[a].pop());
        if(dfs(ns))return true;
      }
    }
    return false;
  }
  return dfs(T.map(x=>x.slice()));
}
function gen(n){
  const kid=S.mode==="kid";
  const c=kid?(n<=12?2+Math.floor((n-1)/3):Math.min(6+Math.floor((n-13)/6),8)):(n<=12?3+Math.floor((n-1)/2):Math.min(9+Math.floor((n-13)/6),11)), empt=(!kid&&n>=19)?1:2;
  let tb;
  for(let at=0;at<25;at++){
  const r=rng(n*7919+13+(kid?5:0)+at*104729), segs=[];
  for(let i=0;i<c;i++)for(let j=0;j<CAP;j++)segs.push(i);
  for(let i=segs.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[segs[i],segs[j]]=[segs[j],segs[i]];}
  const t=[];for(let i=0;i<c;i++)t.push(segs.slice(i*CAP,i*CAP+CAP));
  for(let e=0;e<empt;e++)t.push([]);
  tb=t;if(empt===2||solvable(t))return t;
  }
  tb.push([]);return tb;
}
function showHome(){
  $("game").hidden=true;$("win").classList.remove("on");
  if(!S.mode){$("home").hidden=true;$("mode").hidden=false;return;}
  $("mode").hidden=true;$("home").hidden=false;
  document.body.classList.toggle("kid",S.mode==="kid");
  $("swmode").textContent=S.mode==="kid"?t("toAdult"):t("toKid");
  $("resume").hidden=!S.cur;
  $("resume").textContent=S.cur?t("resumeN",{n:S.cur.level}):t("resume");
  const g=$("grid");g.innerHTML="";
  for(let n=1;n<=TOTAL;n++){
    const b=document.createElement("button");b.className="stage";
    const done=S.cleared[n];
    b.disabled=!(n===1||S.cleared[n-1]);
    if(done)b.classList.add("done");
    const kid=S.mode==="kid";
    b.innerHTML="<b>"+n+"</b><small>"+(kid?(done?"⭐":" "):(done?t("best",{n:done}):t("todo")))+"</small>";
    b.onclick=()=>start(n,true);g.appendChild(b);
  }
}
function start(n,fresh){
  if(fresh||!S.cur||S.cur.level!==n)S.cur={level:n,tubes:gen(n),moves:0,hist:[]};
  sel=null;save();
  $("home").hidden=true;$("game").hidden=false;render();
}
function render(){
  const c=S.cur;
  $("title").textContent=t("stage",{n:c.level});$("moves").textContent=t("moves",{n:c.moves});
  const w=$("tubes");w.innerHTML="";const lm=lastMove;lastMove=null;
  c.tubes.forEach((tb,i)=>{
    const d=document.createElement("div");d.className="tube"+(sel===i?" sel":"")+(lm&&lm.from===i?" from":"");
    d.tabIndex=0;d.setAttribute("role","button");d.setAttribute("aria-label",t("tube",{n:i+1}));
    tb.forEach((v,k)=>{const s=document.createElement("div");s.className="seg"+(lm&&lm.to===i&&k>=tb.length-lm.n?" new":"");s.style.background=COLORS[v];d.appendChild(s);});
    d.onclick=()=>tap(i);
    d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap(i);}};
    w.appendChild(d);
  });
}
function pour(a,b){
  const T=S.cur.tubes,A=T[a],B=T[b];
  if(!A.length||B.length>=CAP)return false;
  const col=A[A.length-1];
  if(B.length&&B[B.length-1]!==col)return false;
  S.cur.hist.push(JSON.stringify(T));
  let n=0;while(A.length&&A[A.length-1]===col&&B.length<CAP){B.push(A.pop());n++;}
  lastMove={from:a,to:b,n};
  S.cur.moves++;return true;
}
function tap(i){
  const T=S.cur.tubes;
  if(sel===null){if(T[i].length){sel=i;snd("sel");}render();return;}
  if(sel===i){sel=null;render();return;}
  const ok=pour(sel,i);
  snd(ok?"pour":"sel");
  sel=ok?null:(T[i].length?i:null);
  if(ok){save();}
  render();
  if(ok&&T.every(t=>t.length===0||(t.length===CAP&&t.every(v=>v===t[0]))))win();
}
function win(){
  const c=S.cur,n=c.level,prev=S.cleared[n];
  if(!prev||c.moves<prev)S.cleared[n]=c.moves;
  S.cur=null;save();
  const kid=S.mode==="kid";
  $("wintitle").textContent=kid?t("kidClear"):t("clear");
  $("winmsg").textContent=kid?t("kidMsg"):t("solved",{n:c.moves})+(prev&&prev<=c.moves?t("keep",{p:prev}):t("newBest"));
  $("next").hidden=n>=TOTAL;$("next").onclick=()=>{$("win").classList.remove("on");start(n+1,true);};
  setTimeout(()=>snd("win"),350);$("win").classList.add("on");
}
$("undo").onclick=()=>{const h=S.cur.hist;if(!h.length)return;S.cur.tubes=JSON.parse(h.pop());snd("undo");S.cur.moves=Math.max(0,S.cur.moves-1);sel=null;save();render();};
$("restart").onclick=()=>start(S.cur.level,true);
$("back").onclick=showHome;
$("tolist").onclick=showHome;
$("resume").onclick=()=>start(S.cur.level,false);
$("swmode").onclick=()=>{setMode(S.mode==="kid"?"adult":"kid");showHome();};
$("m-kid").onclick=()=>{setMode("kid");showHome();};
$("m-adult").onclick=()=>{setMode("adult");showHome();};
function setMute(){$("mute").textContent=S.mute?t("soundOn"):t("soundOff");}
$("mute").onclick=()=>{S.mute=!S.mute;save();setMute();};
applyLang();
showHome();
</script>
</body>
</html>
